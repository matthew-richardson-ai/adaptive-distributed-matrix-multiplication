name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark client dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build services
        run: docker compose build

      - name: Start distributed services
        run: docker compose up -d --scale worker=2

      - name: Wait for services
        run: sleep 5

      - name: Run end-to-end dense smoke benchmark
        run: |
          python -m Benchmarks.run_benchmarks \
            --size 32 \
            --block-size 16 \
            --workers 2 \
            --timeout 60 \
            --output Results/ci_dense.json

      - name: Run end-to-end adaptive sparse smoke benchmark
        run: |
          python -m Benchmarks.run_benchmarks \
            --size 32 \
            --block-size 16 \
            --workers 2 \
            --matrix-type block_sparse \
            --zero-block-fraction 0.5 \
            --adaptive \
            --epsilon 0 \
            --timeout 60 \
            --output Results/ci_sparse.json

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v
